<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 430" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ chính xác ba phòng triển lãm nối tiếp</title>
  <desc id="desc">Ba phòng cùng rộng 12 mét, chiều sâu lần lượt 20, 16 và 16 mét. Cửa nối rộng 3 mét, đặt lệch về phía đông.</desc>
  <defs>
    <pattern id="floor" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#d9d7d2" stroke-width=".7"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#b8322a" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1140" height="430" fill="#faf9f6"/>
  <text x="52" y="42" fill="#1c1714" font-family="Arial,sans-serif" font-size="21" font-weight="700">MẶT BẰNG THAM CHIẾU · GALLERY-1975-V1</text>
  <text x="52" y="65" fill="#5b4e44" font-family="Arial,sans-serif" font-size="12">Ba phòng trên một trục thẳng · cửa lệch về phía đông trong mặt bằng gốc</text>
  <!-- Scale: 15 px / meter. Room depths 20/16/16 m. Width 12 m. -->
  <g transform="translate(180 115)">
    <!-- clear floor areas, each kept separate to show room boundaries -->
    <rect x="0" y="0" width="300" height="180" fill="url(#floor)"/>
    <rect x="300" y="0" width="240" height="180" fill="url(#floor)"/>
    <rect x="540" y="0" width="240" height="180" fill="url(#floor)"/>
    <!-- Long perimeter walls -->
    <path d="M0 0H780 M0 180H780 M0 0V180 M780 0V180" fill="none" stroke="#303133" stroke-width="8"/>
    <!-- Room 1→2 and room 2→3 partitions; 3m door openings centered at 9m from west (6–9m = east side) -->
    <path d="M300 0V90 M300 135V180 M540 0V90 M540 135V180" fill="none" stroke="#303133" stroke-width="8"/>
    <path d="M303 92H336 M543 92H576" fill="none" stroke="#b8322a" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Wide museum photo mounts: symbolic positions on perimeter walls -->
    <g fill="#e9e6df" stroke="#434446" stroke-width="2">
      <rect x="44" y="8" width="64" height="9"/><rect x="133" y="8" width="76" height="9"/><rect x="221" y="8" width="52" height="9"/>
      <rect x="24" y="163" width="70" height="9"/><rect x="124" y="163" width="90" height="9"/><rect x="224" y="163" width="58" height="9"/>
      <rect x="322" y="8" width="72" height="9"/><rect x="410" y="8" width="92" height="9"/>
      <rect x="322" y="163" width="66" height="9"/><rect x="410" y="163" width="90" height="9"/>
      <rect x="562" y="8" width="70" height="9"/><rect x="649" y="8" width="90" height="9"/>
      <rect x="562" y="163" width="80" height="9"/><rect x="660" y="163" width="82" height="9"/>
    </g>
    <!-- Feature slabs and low bench/pedestal islands -->
    <rect x="274" y="58" width="16" height="64" fill="#303133"/>
    <rect x="512" y="58" width="16" height="64" fill="#303133"/>
    <rect x="90" y="71" width="76" height="20" rx="2" fill="#d6d2ca" stroke="#666"/>
    <rect x="378" y="71" width="82" height="20" rx="2" fill="#d6d2ca" stroke="#666"/>
    <rect x="621" y="71" width="78" height="20" rx="2" fill="#d6d2ca" stroke="#666"/>
    <text x="150" y="54" text-anchor="middle" fill="#1c1714" font-family="Arial,sans-serif" font-size="13" font-weight="700">01 · ĐƯỜNG ĐẾN SÀI GÒN</text>
    <text x="420" y="54" text-anchor="middle" fill="#1c1714" font-family="Arial,sans-serif" font-size="13" font-weight="700">02 · NGÀY TOÀN THẮNG</text>
    <text x="660" y="54" text-anchor="middle" fill="#1c1714" font-family="Arial,sans-serif" font-size="13" font-weight="700">03 · ĐẤT NƯỚC LIỀN MỘT DẢI</text>
    <text x="150" y="108" text-anchor="middle" fill="#5b4e44" font-family="Arial,sans-serif" font-size="11">20 m × 12 m</text>
    <text x="420" y="108" text-anchor="middle" fill="#5b4e44" font-family="Arial,sans-serif" font-size="11">16 m × 12 m</text>
    <text x="660" y="108" text-anchor="middle" fill="#5b4e44" font-family="Arial,sans-serif" font-size="11">16 m × 12 m</text>
    <text x="318" y="148" fill="#b8322a" font-family="Arial,sans-serif" font-size="10">CỬA 3 m</text>
    <text x="558" y="148" fill="#b8322a" font-family="Arial,sans-serif" font-size="10">CỬA 3 m</text>
  </g>
  <text x="180" y="334" fill="#5b4e44" font-family="Arial,sans-serif" font-size="11">TÂY / x = −6 m</text>
  <text x="880" y="334" fill="#5b4e44" font-family="Arial,sans-serif" font-size="11">ĐÔNG / x = +6 m</text>
  <text x="180" y="362" fill="#5b4e44" font-family="Arial,sans-serif" font-size="11">Chỉ dẫn hình học lấy từ `exhibition-template.ts`: các phòng nối tiếp theo z; cửa mở trên vách ngang tại z = −8 m và z = −24 m, trên x từ +2 m đến +5 m.</text>
  <text x="180" y="383" fill="#5b4e44" font-family="Arial,sans-serif" font-size="11">Phối cảnh, portal sâu, vách hồi, ánh sáng và khối chương là định hướng redesign; hình minh họa không phải model/texture để dùng trực tiếp.</text>
</svg>
