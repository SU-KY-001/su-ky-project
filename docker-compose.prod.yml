name: suky

# VPS layout: this file + .env.prod sit in the same directory (copy both from the repo root).
# Traefik runs outside this stack and is reached through the external network `proxy-net` (make -f Makefile.prod setup).

x-api: &api
  image: lgdlong/suky-api:latest
  restart: unless-stopped
  pull_policy: always
  env_file:
    - .env.prod
  environment: &api-env
    NODE_ENV: production
    PORT: "3005"
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    BETTER_AUTH_URL: https://${DOMAIN}
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:18.4
    container_name: suky-db
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - suky-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  api:
    <<: *api
    container_name: suky-api
    stop_grace_period: 30s
    networks:
      - suky-network
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.suky-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.suky-api.entrypoints=websecure"
      - "traefik.http.routers.suky-api.tls=true"
      - "traefik.http.routers.suky-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.suky-api.loadbalancer.server.port=3005"

  # Same image as api; runs the release scheduler (src/worker.ts). It serves no HTTP, so the image HEALTHCHECK is off.
  worker:
    <<: *api
    container_name: suky-worker
    stop_grace_period: 30s
    command: ["bun", "src/worker.ts"]
    healthcheck:
      disable: true
    networks:
      - suky-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data:
    driver: local

networks:
  suky-network:
    driver: bridge
  proxy-net:
    name: proxy-net
    external: true
